<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase 8: Rocas | 7° Básico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a1628;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }
        .slides-container {
            position: relative;
            width: 100%;
            max-width: 1300px;
            height: 85vh;
            max-height: 800px;
            background: #0d1b2a;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            border: 1px solid #1a365d;
        }
        .slides-wrapper { position: relative; width: 100%; height: 100%; }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 2.5rem 3rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            overflow-y: auto;
            background: #0d1b2a;
            color: #e2e8f0;
        }
        .slide.active { opacity: 1; visibility: visible; z-index: 10; }
        .slide::-webkit-scrollbar { width: 5px; }
        .slide::-webkit-scrollbar-track { background: #1a365d; border-radius: 10px; }
        .slide::-webkit-scrollbar-thumb { background: #2b6cb0; border-radius: 10px; }
        .slide-number {
            position: absolute; bottom: 20px; right: 30px;
            font-size: 0.75rem; color: #4a7a9c;
            background: #0d1b2a; padding: 0.2rem 0.8rem;
            border-radius: 20px; border: 1px solid #1a365d; z-index: 15;
        }
        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            z-index: 20; background: rgba(26,54,93,0.7);
            border: 1px solid #2b6cb0; color: #90cdf4;
            width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.3rem;
            transition: all 0.3s ease; backdrop-filter: blur(5px);
        }
        .nav-arrow:hover:not(:disabled) { background: #2b6cb0; color: white; transform: translateY(-50%) scale(1.05); }
        .nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
        .nav-arrow-left { left: 15px; }
        .nav-arrow-right { right: 15px; }
        .dots-container {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 15;
            background: rgba(13,27,42,0.8); padding: 6px 14px;
            border-radius: 30px; border: 1px solid #1a365d;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #1a365d; cursor: pointer; transition: all 0.3s ease; }
        .dot.active { background: #2b6cb0; width: 24px; border-radius: 12px; }
        .dot:hover { background: #4a7a9c; }
        .fixed-footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(13,27,42,0.95); backdrop-filter: blur(10px);
            padding: 0.8rem 2rem; display: flex; justify-content: center;
            gap: 2rem; border-top: 1px solid #1a365d; z-index: 1000;
        }
        .footer-btn {
            background: transparent; border: 1px solid #2b6cb0;
            color: #90cdf4; padding: 0.6rem 2rem;
            border-radius: 30px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 8px;
        }
        .footer-btn:hover { background: #2b6cb0; color: white; transform: translateY(-2px); }
        .footer-btn.primary { background: #2b6cb0; color: white; }
        .footer-btn.primary:hover { background: #3182ce; }
        h1 { font-size: 2.8rem; font-weight: 800; color: #90cdf4; margin-bottom: 0.5rem; }
        h2 { font-size: 2rem; font-weight: 700; color: #63b3ed; margin-bottom: 1rem; border-left: 4px solid #2b6cb0; padding-left: 1rem; }
        h3 { font-size: 1.2rem; font-weight: 600; color: #90cdf4; margin: 0.8rem 0 0.4rem 0; }
        .badge {
            display: inline-block; background: #2b6cb0; color: white;
            padding: 0.2rem 1rem; border-radius: 30px; font-size: 0.7rem;
            font-weight: 600; margin-bottom: 0.8rem; letter-spacing: 0.5px;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin: 0.8rem 0; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 0.8rem 0; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin: 0.8rem 0; }
        .card {
            background: rgba(26,54,93,0.4); border-radius: 16px;
            padding: 1.2rem; border: 1px solid #1a365d;
            transition: all 0.2s ease;
        }
        .card:hover { border-color: #2b6cb0; background: rgba(26,54,93,0.6); }
        .card i { font-size: 1.6rem; color: #63b3ed; margin-bottom: 0.5rem; }
        .card h4 { color: #90cdf4; font-size: 1rem; margin-bottom: 0.4rem; }
        .card p, .card li { color: #cbd5e1; font-size: 0.85rem; line-height: 1.5; }
        .card ul { padding-left: 1.2rem; margin-top: 0.3rem; }
        .card ul li { margin-bottom: 0.2rem; }
        .card img { width: 100%; border-radius: 12px; margin-bottom: 0.5rem; border: 1px solid #1a365d; }
        .highlight { color: #63b3ed; font-weight: 600; }
        .info-box {
            background: rgba(26,54,93,0.5); padding: 1rem 1.2rem;
            border-radius: 16px; margin: 0.8rem 0; border-left: 4px solid #2b6cb0;
        }
        .info-box i { color: #63b3ed; margin-right: 8px; }
        .info-box strong { color: #90cdf4; }
        .comparison-table {
            width: 100%; border-collapse: collapse; margin: 0.8rem 0; font-size: 0.85rem;
        }
        .comparison-table th { background: #1a365d; color: #90cdf4; padding: 0.6rem; text-align: left; }
        .comparison-table td { border: 1px solid #1a365d; padding: 0.6rem; color: #cbd5e1; }
        .comparison-table tr:nth-child(even) { background: rgba(26,54,93,0.3); }
        .cycle-image { width: 100%; max-height: 400px; object-fit: contain; border-radius: 12px; border: 1px solid #1a365d; }
        .rock-image { width: 100%; border-radius: 12px; margin-bottom: 0.5rem; border: 1px solid #1a365d; }
        @media (max-width: 768px) {
            body { padding: 10px; padding-bottom: 70px; }
            .slides-container { height: 80vh; border-radius: 20px; }
            .slide { padding: 1.2rem 1.5rem; }
            h1 { font-size: 1.6rem; }
            h2 { font-size: 1.3rem; }
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .nav-arrow { width: 36px; height: 36px; font-size: 1rem; }
            .nav-arrow-left { left: 8px; }
            .nav-arrow-right { right: 8px; }
            .fixed-footer { padding: 0.5rem 1rem; gap: 1rem; }
            .footer-btn { padding: 0.4rem 1.2rem; font-size: 0.8rem; }
            .dots-container { bottom: 12px; padding: 4px 10px; }
            .dot { width: 8px; height: 8px; }
            .dot.active { width: 18px; }
            .slide-number { bottom: 12px; right: 16px; font-size: 0.6rem; }
            .cycle-image { max-height: 250px; }
        }
    </style>
</head>
<body>

<div class="slides-container">
    <button class="nav-arrow nav-arrow-left" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
    <button class="nav-arrow nav-arrow-right" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
    <div class="dots-container" id="dotsContainer"></div>
    <div class="slides-wrapper" id="slidesWrapper"></div>
</div>

<div class="fixed-footer">
    <button class="footer-btn" id="cursoBtn"><i class="fas fa-book-open"></i> Curso</button>
    <button class="footer-btn primary" id="ejerciciosBtn"><i class="fas fa-pen-alt"></i> Ejercicios</button>
</div>

<script>
    // ================================================================
    // SLIDES - ROCAS (INFORMACIÓN COMPLETA)
    // ================================================================

    const slides = [

        // === SLIDE 0: PORTADA ===
        {
            title: "Las Rocas",
            content: `
                <div style="display:flex; flex-direction:column; justify-content:center; height:100%;">
                    <div class="badge">Clase 8 - Ciencias Naturales</div>
                    <h1 style="font-size:3.2rem;">Las Rocas</h1>
                    <p style="font-size:1.3rem; color:#90cdf4; margin:0.5rem 0;">Tipos de rocas • Ciclo de las rocas • Características</p>
                    <div style="margin-top:1.5rem; display:flex; gap:1.5rem; flex-wrap:wrap;">
                        <div style="background:rgba(26,54,93,0.5); padding:0.5rem 1.2rem; border-radius:30px; border:1px solid #1a365d;">
                            <i class="fas fa-gem" style="color:#63b3ed;"></i> Ígneas
                        </div>
                        <div style="background:rgba(26,54,93,0.5); padding:0.5rem 1.2rem; border-radius:30px; border:1px solid #1a365d;">
                            <i class="fas fa-layer-group" style="color:#63b3ed;"></i> Sedimentarias
                        </div>
                        <div style="background:rgba(26,54,93,0.5); padding:0.5rem 1.2rem; border-radius:30px; border:1px solid #1a365d;">
                            <i class="fas fa-bolt" style="color:#63b3ed;"></i> Metamórficas
                        </div>
                    </div>
                    <div style="margin-top:2rem; color:#4a7a9c; font-size:0.9rem;">
                        <i class="fas fa-arrow-right"></i> Usa las flechas ← → para navegar
                    </div>
                </div>
            `
        },

        // === SLIDE 1: INTRODUCCIÓN A LAS ROCAS ===
        {
            title: "🪨 Introducción a las rocas",
            content: `
                <div class="badge">Rocas - Introducción</div>
                <h2>¿Qué son las rocas?</h2>
                <div class="grid-2">
                    <div class="card">
                        <i class="fas fa-gem"></i>
                        <h4>Definición</h4>
                        <p>Una <span class="highlight">roca</span> es una <span class="highlight">mezcla heterogénea</span> de varios <span class="highlight">minerales</span> que se forma de manera natural.</p>
                        <p style="margin-top:0.5rem;">Las rocas están compuestas por uno o más minerales y pueden tener diferentes texturas, colores y composiciones químicas.</p>
                    </div>
                    <div class="card">
                        <i class="fas fa-layer-group"></i>
                        <h4>Clasificación general</h4>
                        <p>Según su origen y proceso de formación, las rocas se dividen en <span class="highlight">tres grandes grupos</span>:</p>
                        <ul>
                            <li><span class="highlight">Ígneas</span>: Solidificación de magma o lava</li>
                            <li><span class="highlight">Sedimentarias</span>: Compactación de sedimentos</li>
                            <li><span class="highlight">Metamórficas</span>: Transformación por presión y calor</li>
                        </ul>
                    </div>
                </div>
                <div class="info-box">
                    <i class="fas fa-lightbulb"></i> <strong>Dato clave:</strong> Las rocas están en <span class="highlight">constante transformación</span> a través del <span class="highlight">ciclo de las rocas</span>, donde un tipo de roca puede convertirse en otro.
                </div>
            `
        },

        // === SLIDE 2: ROCAS ÍGNEAS - INTRODUCCIÓN ===
        {
            title: "🔥 Rocas ígneas",
            content: `
                <div class="badge">Rocas - Ígneas</div>
                <h2>¿Qué son las rocas ígneas?</h2>
                <div class="grid-2">
                    <div class="card">
                        <i class="fas fa-fire"></i>
                        <h4>Formación</h4>
                        <p>Se forman a partir de la <span class="highlight">solidificación del magma</span> en el interior de la Tierra o de la <span class="highlight">lava</span> en la superficie.</p>
                    </div>
                    <div class="card">
                        <i class="fas fa-thermometer-half"></i>
                        <h4>Tipos según enfriamiento</h4>
                        <ul>
                            <li><span class="highlight">Intrusivas</span>: Enfriamiento <strong>lento</strong> en el interior → cristales grandes (ej. granito)</li>
                            <li><span class="highlight">Extrusivas</span>: Enfriamiento <strong>rápido</strong> en la superficie → cristales pequeños o sin cristales (ej. basalto, obsidiana)</li>
                        </ul>
                    </div>
                </div>
                <div class="info-box">
                    <i class="fas fa-lightbulb"></i> <strong>Característica:</strong> Las rocas ígneas son las <span class="highlight">más abundantes</span> en la corteza terrestre y constituyen aproximadamente el <span class="highlight">65%</span> de la corteza continental.
                </div>
            `
        },

        // === SLIDE 3: GRANITO ===
        {
            title: "🧱 Granito",
            content: `
                <div class="badge">Rocas ígneas</div>
                <h2>Granito</h2>
                <div class="grid-2">
                    <div class="card">
                        <img src="https://i.ibb.co/Csms4J36/image.png" alt="Granito" class="rock-image">
                        <h4>Características</h4>
                        <ul>
                            <li><span class="highlight">Tipo</span>: Ígnea intrusiva</li>
                            <li><span class="highlight">Enfriamiento</span>: Lento en el interior de la Tierra</li>
                            <li><span class="highlight">Textura</span>: Granular, cristales visibles a simple vista</li>
                            <li><span class="highlight">Color</span>: Claro (blanco, gris, rosado) por su alto contenido de cuarzo y feldespato</li>
                            <li><span class="highlight">Composición</span>: Cuarzo, feldespato (ortosa y plagioclasa), mica (biotita o moscovita)</li>
                            <li><span class="highlight">Dureza</span>: Alta (6-7 en la escala de Mohs)</li>
                        </ul>
                    </div>
                    <div class="card">
                        <h4>Información adicional</h4>
                        <ul>
                            <li>Es la <span class="highlight">roca más común</span> en la corteza continental</li>
                            <li>Forma la mayor parte de los <span class="highlight">batolitos</span> (grandes masas de roca ígnea)</li>
                            <li>Se utiliza ampliamente en <span class="highlight">construcción</span> (encimeras, suelos, monumentos)</li>
                            <li>Ejemplo famoso: El <span class="highlight">Monte Rushmore</span> en EE.UU. está tallado en granito</li>
                            <li>En Chile: Presente en la <span class="highlight">Cordillera de los Andes</span></li>
                        </ul>
                        <div class="info-box" style="margin-top:0.5rem;">
                            <i class="fas fa-lightbulb"></i> <strong>Dato:</strong> El granito es <span class="highlight">resistente a la erosión</span>, por eso forma montañas y cerros prominentes.
                        </div>
                    </div>
                </div>
            `
        },

        // === SLIDE 4: BASALTO ===
        {
            title: "🪨 Basalto",
            content: `
                <div class="badge">Rocas ígneas</div>
                <h2>Basalto</h2>
                <div class="grid-2">
                    <div class="card">
                        <img src="https://i.ibb.co/WdNPyBq/image.png" alt="Basalto" class="rock-image">
                        <h4>Características</h4>
                        <ul>
                            <li><span class="highlight">Tipo</span>: Ígnea extrusiva</li>
                            <li><span class="highlight">Enfriamiento</span>: Rápido en la superficie terrestre</li>
                            <li><span class="highlight">Textura</span>: Fina, con cristales pequeños que requieren lupa para verse</li>
                            <li><span class="highlight">Color</span>: Oscuro (negro o gris oscuro) por alto contenido de minerales ferromagnesianos</li>
                            <li><span class="highlight">Composición</span>: Plagioclasa (calcica), piroxeno, olivino</li>
                            <li><span class="highlight">Dureza</span>: Moderada (5-6 en la escala de Mohs)</li>
                        </ul>
                    </div>
                    <div class="card">
                        <h4>Información adicional</h4>
                        <ul>
                            <li>Es la <span class="highlight">roca más común</span> en la <span class="highlight">corteza oceánica</span></li>
                            <li>Forma el <span class="highlight">fondo de los océanos</span> y las <span class="highlight">dorsales oceánicas</span></li>
                            <li>También se encuentra en <span class="highlight">islas volcánicas</span> (ej. Hawái, Islandia)</li>
                            <li>En Chile: Forma parte de la <span class="highlight">Cordillera de la Costa</span> y del fondo marino frente a nuestras costas</li>
                            <li>Se utiliza en <span class="highlight">construcción</span> como material de relleno y en <span class="highlight">carreteras</span></li>
                        </ul>
                        <div class="info-box" style="margin-top:0.5rem;">
                            <i class="fas fa-lightbulb"></i> <strong>Dato:</strong> El basalto es la roca <span class="highlight">más voluminosa</span> de la Tierra, formando la mayor parte de la litosfera oceánica.
                        </div>
                    </div>
                </div>
            `
        },

        // === SLIDE 5: OBSIDIANA ===
        {
            title: "🪨 Obsidiana",
            content: `
                <div class="badge">Rocas ígneas</div>
                <h2>Obsidiana</h2>
                <div class="grid-2">
                    <div class="card">
                        <img src="https://i.ibb.co/pjK3JJMy/image.png" alt="Obsidiana" class="rock-image">
                        <h4>Características</h4>
                        <ul>
                            <li><span class="highlight">Tipo</span>: Ígnea extrusiva</li>
                            <li><span class="highlight">Enfriamiento</span>: Extremadamente rápido (casi instantáneo)</li>
                            <li><span class="highlight">Textura</span>: Vítrea (vidriosa), <span class="highlight">sin estructura cristalina</span></li>
                            <li><span class="highlight">Color</span>: Negro, gris oscuro, a veces con bandas o manchas</li>
                            <li><span class="highlight">Composición</span>: Similar al granito y la riolita (rica en sílice)</li>
                            <li><span class="highlight">Dureza</span>: 5-5.5 en la escala de Mohs</li>
                        </ul>
                    </div>
                    <div class="card">
                        <h4>Información adicional</h4>
                        <ul>
                            <li>Es un <span class="highlight">vidrio volcánico</span> natural</li>
                            <li>Se rompe con <span class="highlight">bordes extremadamente filosos</span> (fractura concoidea)</li>
                            <li>Fue utilizada por culturas prehistóricas para fabricar <span class="highlight">herramientas</span> y <span class="highlight">armas</span> (puntas de flecha, cuchillos)</li>
                            <li>Los <span class="highlight">aztecas</span> la llamaban "iztli" y la usaban para hacer cuchillos ceremoniales</li>
                            <li>En Chile: Se encuentra en zonas volcánicas de la <span class="highlight">Cordillera de los Andes</span></li>
                        </ul>
                        <div class="info-box" style="margin-top:0.5rem;">
                            <i class="fas fa-lightbulb"></i> <strong>Dato curioso:</strong> La obsidiana se utilizaba en la antigüedad para fabricar <span class="highlight">espejos</span> y objetos decorativos.
                        </div>
                    </div>
                </div>
            `
        },

        // === SLIDE 6: SIENITA ===
        {
            title: "🪨 Sienita",
            content: `
                <div class="badge">Rocas ígneas</div>
                <h2>Sienita</h2>
                <div class="grid-2">
                    <div class="card">
                        <img src="https://i.ibb.co/8LyBwgd1/image.png" alt="Sienita" class="rock-image">
                        <h4>Características</h4>
                        <ul>
                            <li><span class="highlight">Tipo</span>: Ígnea intrusiva</li>
                            <li><span class="highlight">Enfriamiento</span>: Lento en el interior</li>
                            <li><span class="highlight">Textura</span>: Granular, cristales visibles a simple vista</li>
                            <li><span class="highlight">Color</span>: Claro (gris, rosado, rojo) similar al granito</li>
                            <li><span class="highlight">Composición</span>: Principalmente <span class="highlight">feldespato alcalino</span> (ortosa) con poca o <span class="highlight">ninguna cantidad de cuarzo</span></li>
                            <li><span class="highlight">Dureza</span>: 6-6.5 en la escala de Mohs</li>
                        </ul>
                    </div>
                    <div class="card">
                        <h4>Información adicional</h4>
                        <ul>
                            <li>Se diferencia del granito por su <span class="highlight">falta de cuarzo</span> (menos del 5%)</li>
                            <li>Contiene <span class="highlight">feldespato alcalino</span> (ortosa) y <span class="highlight">anfíboles</span></li>
                            <li>Es menos común que el granito</li>
                            <li>Se encuentra en <span class="highlight">intrusiones ígneas</span> asociadas a granitos y dioritas</li>
                            <li>En Chile: Presente en la <span class="highlight">Cordillera de los Andes</span>, especialmente en la zona central</li>
                            <li>Se utiliza en <span class="highlight">construcción</span> como piedra ornamental</li>
                        </ul>
                        <div class="info-box" style="margin-top:0.5rem;">
                            <i class="fas fa-lightbulb"></i> <strong>Dato:</strong> La sienita recibe su nombre de la ciudad de <span class="highlight">Siena</span> (Egipto), donde se extraía en la antigüedad.
                        </div>
                    </div>
                </div>
            `
        },

        // === SLIDE 7: PIEDRA PÓMEZ ===
        {
            title: "🪨 Piedra Pómez",
            content: `
                <div class="badge">Rocas ígneas</div>
                <h2>Piedra Pómez (Pumita)</h2>
                <div class="grid-2">
                    <div class="card">
                        <img src="https://i.ibb.co/MkDYhwSM/image.png" alt="Piedra pómez" class="rock-image">
                        <h4>Características</h4>
                        <ul>
                            <li><span class="highlight">Tipo</span>: Ígnea extrusiva</li>
                            <li><span class="highlight">Enfriamiento</span>: Rápido con gases atrapados</li>
                            <li><span class="highlight">Textura</span>: <span class="highlight">Muy porosa</span> (parece una esponja) por la expansión de gases</li>
                            <li><span class="highlight">Color</span>: Gris, blanco, a veces amarillento</li>
                            <li><span class="highlight">Composición</span>: Rica en sílice (vidrio volcánico con burbujas)</li>
                            <li><span class="highlight">Dureza</span>: 6 en la escala de Mohs</li>
                        </ul>
                    </div>
                    <div class="card">
                        <h4>Información adicional</h4>

    // ================================================================
    // LÓGICA DE NAVEGACIÓN
    // ================================================================

    let currentSlide = 0;
    const totalSlides = slides.length;

    function renderSlides() {
        const wrapper = document.getElementById('slidesWrapper');
        wrapper.innerHTML = '';
        slides.forEach((slide, index) => {
            const div = document.createElement('div');
            div.className = 'slide';
            if (index === 0) div.classList.add('active');
            div.setAttribute('data-index', index);
            div.innerHTML = `
                ${slide.content}
                <div class="slide-number">${index + 1} / ${totalSlides}</div>
            `;
            wrapper.appendChild(div);
        });
        updateDots();
        updateButtons();
    }

    function updateDots() {
        const container = document.getElementById('dotsContainer');
        container.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            if (i === currentSlide) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(i));
            container.appendChild(dot);
        }
    }

    function updateButtons() {
        document.getElementById('prevBtn').disabled = currentSlide === 0;
        document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
    }

    function goToSlide(index) {
        if (index < 0 || index >= totalSlides) return;
        currentSlide = index;
        const slidesElements = document.querySelectorAll('.slide');
        slidesElements.forEach((slide, i) => {
            slide.classList.toggle('active', i === currentSlide);
        });
        updateDots();
        updateButtons();
    }

    function nextSlide() {
        if (currentSlide < totalSlides - 1) goToSlide(currentSlide + 1);
    }

    function prevSlide() {
        if (currentSlide > 0) goToSlide(currentSlide - 1);
    }

    document.getElementById('prevBtn').addEventListener('click', prevSlide);
    document.getElementById('nextBtn').addEventListener('click', nextSlide);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });

    document.getElementById('cursoBtn').addEventListener('click', () => {
        window.location.href = 'Fisica.html';
    });

    document.getElementById('ejerciciosBtn').addEventListener('click', () => {
        window.location.href = 'C_8A_Fisica.html';
    });

    renderSlides();
</script>
