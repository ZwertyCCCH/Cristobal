        // Adicionales de la clase (10)
        { text: "¿Qué es la marejada ciclónica?", options: ["Una ola gigante como un tsunami", "El aumento anormal del nivel del mar por vientos y baja presión", "Una tormenta de lluvia intensa", "El viento más fuerte del huracán"], correct: "El aumento anormal del nivel del mar por vientos y baja presión" },
        { text: "¿Cuál es la doble amenaza de un huracán?", options: ["Lluvia y granizo", "Vientos destructivos y agua (lluvias y marejada)", "Terremotos y tsunamis", "Calor y humedad"], correct: "Vientos destructivos y agua (lluvias y marejada)" },
        { text: "¿Qué parte del huracán es una zona de calma y cielo despejado?", options: ["La pared del ojo", "El ojo", "Las bandas de nubes", "El exterior"], correct: "El ojo" },
        { text: "¿Qué parte del huracán tiene los vientos más intensos?", options: ["El ojo", "La pared del ojo", "Las bandas de nubes", "El exterior"], correct: "La pared del ojo" },
        { text: "¿Qué vientos debe tener un huracán para ser considerado categoría 5 en la escala Saffir-Simpson?", options: ["Más de 119 km/h", "Más de 178 km/h", "Más de 209 km/h", "Más de 252 km/h"], correct: "Más de 252 km/h" },
        { text: "¿Qué es la intensificación rápida de un huracán?", options: ["Cuando el huracán se debilita rápidamente", "Cuando el huracán aumenta su fuerza en poco tiempo", "Cuando el huracán cambia de dirección", "Cuando el huracán se disipa"], correct: "Cuando el huracán aumenta su fuerza en poco tiempo" },
        { text: "¿Qué efecto tiene el cambio climático en la frecuencia de huracanes de categoría 4 y 5?", options: ["Han disminuido", "Han aumentado en proporción", "No han cambiado", "Han desaparecido"], correct: "Han aumentado en proporción" },
        { text: "¿Qué es un tifón?", options: ["Un huracán en el Atlántico", "Un huracán en el Pacífico Noroccidental", "Un huracán en el Océano Índico", "Un tipo de tornado"], correct: "Un huracán en el Pacífico Noroccidental" },
        { text: "¿Cuándo es la temporada de huracanes en el Océano Atlántico?", options: ["1 de enero - 30 de abril", "1 de junio - 30 de noviembre", "15 de mayo - 30 de noviembre", "Todo el año"], correct: "1 de junio - 30 de noviembre" },
        { text: "¿Qué huracán devastó Nueva Orleans en 2005?", options: ["Irma", "Katrina", "Harvey", "Maria"], correct: "Katrina" }
    ];

    // ================================================================
    // TSUNAMIS - 20 preguntas (61-80)
    // ================================================================
    const tsunamisPool = [
        // Del documento (10 - reformuladas para ser sobre tsunamis)
        { text: "¿Qué es un tsunami?", options: ["Un terremoto", "Un conjunto de olas de gran energía generadas por fenómenos geológicos", "Una erupción volcánica", "Un huracán"], correct: "Un conjunto de olas de gran energía generadas por fenómenos geológicos" },
        { text: "¿Cuál es la causa principal de los tsunamis?", options: ["Los huracanes", "Los terremotos submarinos (>80%)", "Las tormentas eléctricas", "Las mareas altas"], correct: "Los terremotos submarinos (>80%)" },
        { text: "¿Qué característica tienen los tsunamis en alta mar?", options: ["Alta velocidad y baja altura", "Baja velocidad y alta altura", "Velocidad media y altura media", "Son muy lentos"], correct: "Alta velocidad y baja altura" },
        { text: "¿Qué ocurre con la altura de la ola de un tsunami al acercarse a la costa?", options: ["Disminuye", "Aumenta drásticamente (efecto de shoaling)", "Se mantiene igual", "Desaparece"], correct: "Aumenta drásticamente (efecto de shoaling)" },
        { text: "¿Qué velocidad puede alcanzar un tsunami en alta mar?", options: ["50-100 km/h", "100-300 km/h", "500-600 km/h", "Hasta 800 km/h"], correct: "Hasta 800 km/h" },
        { text: "¿Qué tsunami chileno cruzó el Océano Pacífico y llegó a Japón y Hawái?", options: ["Maule 2010", "Valdivia 1960", "Iquique 2014", "Coquimbo 2015"], correct: "Valdivia 1960" },
        { text: "¿Qué es el efecto de shoaling?", options: ["Aumento de la velocidad de la ola", "Aumento de la altura de la ola al acercarse a la costa", "Disminución de la altura de la ola", "Desaparición de la ola"], correct: "Aumento de la altura de la ola al acercarse a la costa" },
        { text: "¿Qué instituciones emiten alertas de tsunami en Chile?", options: ["SERNAC y CONAF", "SHOA y ONEMI", "MINSAL y CSN", "SAE y CENSO"], correct: "SHOA y ONEMI" },
        { text: "¿Qué magnitud tuvo el terremoto de Valdivia que generó el tsunami de 1960?", options: ["8.8", "9.5", "8.2", "9.0"], correct: "9.5" },
        { text: "¿Qué altura alcanzaron las olas del tsunami de Valdivia en 1960?", options: ["10 metros", "15 metros", "25 metros", "40 metros"], correct: "25 metros" },
        // Adicionales de la clase (10)
        { text: "¿Qué tsunami del siglo XXI fue el más mortífero con aproximadamente 230.000 víctimas?", options: ["Japón 2011", "Océano Índico 2004", "Chile 2010", "Filipinas 1976"], correct: "Océano Índico 2004" },
        { text: "¿Qué altura alcanzaron las olas del tsunami de Japón en 2011?", options: ["10 metros", "20 metros", "30 metros", "40 metros"], correct: "40 metros" },
        { text: "¿Qué desastre adicional provocó el tsunami de Japón en 2011?", options: ["Un terremoto", "Un desastre nuclear en Fukushima", "Una erupción volcánica", "Una tormenta de nieve"], correct: "Un desastre nuclear en Fukushima" },
        { text: "¿Qué erupción volcánica en 1883 generó un tsunami de 40 metros?", options: ["Tonga 2022", "Krakatoa 1883", "Tambora 1815", "Vesubio 79 d.C."], correct: "Krakatoa 1883" },
        { text: "¿Qué erupción volcánica en 2022 generó un tsunami que cruzó el Pacífico?", options: ["Krakatoa", "Tonga", "Fuji", "Etna"], correct: "Tonga" },
        { text: "¿Qué magnitud tuvo el terremoto que generó el tsunami de Maule en 2010?", options: ["7.5", "8.8", "9.5", "8.2"], correct: "8.8" },
        { text: "¿Qué es un tsunami local?", options: ["Un tsunami que cruza océanos", "Un tsunami que afecta solo la zona cercana al epicentro", "Un tsunami pequeño", "Un tsunami generado por un huracán"], correct: "Un tsunami que afecta solo la zona cercana al epicentro" },
        { text: "¿Qué es un tsunami distante o transoceánico?", options: ["Un tsunami que afecta solo la costa cercana", "Un tsunami que cruza océanos enteros", "Un tsunami pequeño", "Un tsunami generado por un volcán"], correct: "Un tsunami que cruza océanos enteros" },
        { text: "¿Qué instrumento mide los cambios en el nivel del mar en puertos y costas para detectar tsunamis?", options: ["Sismógrafo", "Boyas DART", "Mareógrafo", "Barómetro"], correct: "Mareógrafo" },
        { text: "¿Qué país europeo fue afectado por un tsunami en 1755 que mató a más de 50.000 personas?", options: ["Italia", "España", "Portugal (Lisboa)", "Grecia"], correct: "Portugal (Lisboa)" }
    ];

    // ================================================================
    // POOL COMPLETO - 80 PREGUNTAS
    // ================================================================

    const fullPool = [
        ...sismosPool.map((q, i) => ({ ...q, tema: 'sismos' })),
        ...volcanesPool.map((q, i) => ({ ...q, tema: 'volcanes' })),
        ...huracanesPool.map((q, i) => ({ ...q, tema: 'huracanes' })),
        ...tsunamisPool.map((q, i) => ({ ...q, tema: 'tsunamis' }))
    ];

    // ================================================================
    // FUNCIONES DE SELECCIÓN Y EVALUACIÓN
    // ================================================================

    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function getRandomQuestions() {
        // Seleccionar 10 de cada tema para asegurar distribución equilibrada
        const temas = ['sismos', 'volcanes', 'huracanes', 'tsunamis'];
        let seleccionadas = [];

        temas.forEach(tema => {
            const poolTema = fullPool.filter(q => q.tema === tema);
            const shuffled = shuffleArray(poolTema);
            seleccionadas = seleccionadas.concat(shuffled.slice(0, 10));
        });

        // Mezclar y devolver
        return shuffleArray(seleccionadas);
    }

    // ================================================================
    // RENDERIZADO Y EVALUACIÓN
    // ================================================================

    let currentQuestions = [];
    let userAnswers = [];
    let evaluated = false;

    function renderQuestions() {
        currentQuestions = getRandomQuestions();
        userAnswers = new Array(currentQuestions.length).fill(null);
        evaluated = false;

        const container = document.getElementById('examContent');
        container.innerHTML = '';

        currentQuestions.forEach((q, idx) => {
            const div = document.createElement('div');
            div.className = 'question-card';
            div.id = `q-${idx}`;

            const shuffledOptions = shuffleArray(q.options);

            div.innerHTML = `
                <div class="question-number">Pregunta ${idx + 1} de ${currentQuestions.length}</div>
                <div class="question-text">${q.text}</div>
                <div class="options">
                    ${shuffledOptions.map(opt => `
                        <label>
                            <input type="radio" name="q_${idx}" value="${opt}">
                            <span>${opt}</span>
                        </label>
                    `).join('')}
                </div>
                <div class="feedback-text" id="fb-${idx}"></div>
            `;

            container.appendChild(div);

            const radios = div.querySelectorAll(`input[name="q_${idx}"]`);
            radios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (!evaluated) {
                        userAnswers[idx] = e.target.value;
                        actualizarContador();
                    }
                });
            });
        });

        document.getElementById('totalQuestions').textContent = currentQuestions.length;
        actualizarContador();
        document.getElementById('results').style.display = 'none';
        document.getElementById('evaluateBtn').disabled = false;
    }

    function actualizarContador() {
        const respondidas = userAnswers.filter(a => a !== null).length;
        document.getElementById('answeredCount').textContent = respondidas;
    }

    function evaluarTest() {
        if (evaluated) return;
        evaluated = true;

        let correctas = 0;
        const total = currentQuestions.length;

        currentQuestions.forEach((q, idx) => {
            const card = document.getElementById(`q-${idx}`);
            const fb = document.getElementById(`fb-${idx}`);
            const userAnswer = userAnswers[idx];
            const isCorrect = userAnswer === q.correct;

            if (isCorrect) {
                correctas++;
                card.classList.add('correct');
                fb.className = 'feedback-text show correct-fb';
                fb.innerHTML = '✅ Correcto';
            } else {
                card.classList.add('incorrect');
                fb.className = 'feedback-text show incorrect-fb';
                fb.innerHTML = `❌ Incorrecto. Respuesta correcta: <strong>${q.correct}</strong>`;
            }

            const radios = card.querySelectorAll('input[type="radio"]');
            radios.forEach(r => r.disabled = true);
        });

        const porcentaje = (correctas / total) * 100;
        let nota = 0;
        if (porcentaje >= 60) {
            nota = 4.0 + ((porcentaje - 60) / 40) * 3.0;
        } else {
            nota = 1.0 + (porcentaje / 60) * 3.0;
        }
        nota = Math.round(nota * 100) / 100;

        const aprobado = nota >= 4.0;

        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        resultsDiv.innerHTML = `
            <h3>📊 Resultados</h3>
            <div class="score">✅ Respuestas correctas: <span style="color:#63b3ed;">${correctas}</span> de ${total}</div>
            <div class="grade ${aprobado ? 'approved' : 'failed'}">
                ${aprobado ? '🎉 APROBADO 🎉' : '📖 REPROBADO 📖'}<br>
                <strong>NOTA FINAL: ${nota}</strong>
            </div>
            <div class="details">
                <span>📈 Porcentaje: ${Math.round(porcentaje)}%</span>
                <span>✅ Exigencia: 60%</span>
            </div>
            <div class="action-buttons">
                <button class="btn btn-primary" id="restartBtn">🔄 Reiniciar Test</button>
                <button class="btn btn-secondary" id="backToClassBtn">📚 Volver a la Clase</button>
                <button class="btn btn-outline" id="backToCourseBtn">🏠 Volver al Curso</button>
            </div>
        `;

        document.getElementById('evaluateBtn').disabled = true;

        document.getElementById('restartBtn').addEventListener('click', restartTest);
        document.getElementById('backToClassBtn').addEventListener('click', () => {
            window.location.href = 'C_7_Fisica.html';
        });
        document.getElementById('backToCourseBtn').addEventListener('click', () => {
            window.location.href = 'Fisica.html';
        });

        resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function restartTest() {
        renderQuestions();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ================================================================
    // INICIALIZACIÓN
    // ================================================================

    renderQuestions();

    document.getElementById('evaluateBtn').addEventListener('click', evaluarTest);

    console.log('✅ Pool de preguntas cargado. Total:', fullPool.length);
    console.log('📊 Distribución por tema:');
    console.log(`  Sismos: ${sismosPool.length} preguntas`);
    console.log(`  Volcanes: ${volcanesPool.length} preguntas`);
    console.log(`  Huracanes: ${huracanesPool.length} preguntas`);
    console.log(`  Tsunamis: ${tsunamisPool.length} preguntas`);
</script>
</body>
</html>
