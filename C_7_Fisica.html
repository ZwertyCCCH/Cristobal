<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase 7: Sismos, Volcanes, Huracanes y Tsunamis | 7° Básico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a1628;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }
        .slides-container {
            position: relative;
            width: 100%;
            max-width: 1300px;
            height: 85vh;
            max-height: 800px;
            background: #0d1b2a;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            border: 1px solid #1a365d;
        }
        .slides-wrapper { position: relative; width: 100%; height: 100%; }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 2.5rem 3rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            overflow-y: auto;
            background: #0d1b2a;
            color: #e2e8f0;
        }
        .slide.active { opacity: 1; visibility: visible; z-index: 10; }
        .slide::-webkit-scrollbar { width: 5px; }
        .slide::-webkit-scrollbar-track { background: #1a365d; border-radius: 10px; }
        .slide::-webkit-scrollbar-thumb { background: #2b6cb0; border-radius: 10px; }
        .slide-number {
            position: absolute; bottom: 20px; right: 30px;
            font-size: 0.75rem; color: #4a7a9c;
            background: #0d1b2a; padding: 0.2rem 0.8rem;
            border-radius: 20px; border: 1px solid #1a365d; z-index: 15;
        }
        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            z-index: 20; background: rgba(26,54,93,0.7);
            border: 1px solid #2b6cb0; color: #90cdf4;
            width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.3rem;
            transition: all 0.3s ease; backdrop-filter: blur(5px);
        }
        .nav-arrow:hover:not(:disabled) { background: #2b6cb0; color: white; transform: translateY(-50%) scale(1.05); }
        .nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
        .nav-arrow-left { left: 15px; }
        .nav-arrow-right { right: 15px; }
        .dots-container {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 15;
            background: rgba(13,27,42,0.8); padding: 6px 14px;
            border-radius: 30px; border: 1px solid #1a365d;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #1a365d; cursor: pointer; transition: all 0.3s ease; }
        .dot.active { background: #2b6cb0; width: 24px; border-radius: 12px; }
        .dot:hover { background: #4a7a9c; }
        .fixed-footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(13,27,42,0.95); backdrop-filter: blur(10px);
            padding: 0.8rem 2rem; display: flex; justify-content: center;
            gap: 2rem; border-top: 1px solid #1a365d; z-index: 1000;
        }
        .footer-btn {
            background: transparent; border: 1px solid #2b6cb0;
            color: #90cdf4; padding: 0.6rem 2rem;
            border-radius: 30px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 8px;
        }
        .footer-btn:hover { background: #2b6cb0; color: white; transform: translateY(-2px); }
        .footer-btn.primary { background: #2b6cb0; color: white; }
        .footer-btn.primary:hover { background: #3182ce; }
        h1 { font-size: 2.8rem; font-weight: 800; color: #90cdf4; margin-bottom: 0.5rem; }
        h2 { font-size: 2rem; font-weight: 700; color: #63b3ed; margin-bottom: 1rem; border-left: 4px solid #2b6cb0; padding-left: 1rem; }
        h3 { font-size: 1.2rem; font-weight: 600; color: #90cdf4; margin: 0.8rem 0 0.4rem 0; }
        .badge {
            display: inline-block; background: #2b6cb0; color: white;
            padding: 0.2rem 1rem; border-radius: 30px; font-size: 0.7rem;
            font-weight: 600; margin-bottom: 0.8rem; letter-spacing: 0.5px;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin: 0.8rem 0; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin: 0.8rem 0; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin: 0.8rem 0; }
        .card {
            background: rgba(26,54,93,0.4); border-radius: 16px;
            padding: 1.2rem; border: 1px solid #1a365d;
            transition: all 0.2s ease;
        }
        .card:hover { border-color: #2b6cb0; background: rgba(26,54,93,0.6); }
        .card i { font-size: 1.6rem; color: #63b3ed; margin-bottom: 0.5rem; }
        .card h4 { color: #90cdf4; font-size: 1rem; margin-bottom: 0.4rem; }
        .card p, .card li { color: #cbd5e1; font-size: 0.85rem; line-height: 1.5; }
        .card ul { padding-left: 1.2rem; margin-top: 0.3rem; }
        .card ul li { margin-bottom: 0.2rem; }
        .card img { width: 100%; border-radius: 12px; margin-bottom: 0.5rem; border: 1px solid #1a365d; }
        .highlight { color: #63b3ed; font-weight: 600; }
        .highlight-warm { color: #f6ad55; font-weight: 600; }
        .info-box {
            background: rgba(26,54,93,0.5); padding: 1rem 1.2rem;
            border-radius: 16px; margin: 0.8rem 0; border-left: 4px solid #2b6cb0;
        }
        .info-box i { color: #63b3ed; margin-right: 8px; }
        .info-box strong { color: #90cdf4; }
        .example-box {
            background: rgba(43,108,176,0.15); border-left: 4px solid #2b6cb0;
            padding: 0.8rem 1.2rem; border-radius: 12px; margin: 0.8rem 0;
        }
        .example-box strong { color: #90cdf4; }
        .comparison-table {
            width: 100%; border-collapse: collapse; margin: 0.8rem 0; font-size: 0.85rem;
        }
        .comparison-table th { background: #1a365d; color: #90cdf4; padding: 0.6rem; text-align: left; }
        .comparison-table td { border: 1px solid #1a365d; padding: 0.6rem; color: #cbd5e1; }
        .comparison-table tr:nth-child(even) { background: rgba(26,54,93,0.3); }
        .timeline {
            display: flex; flex-wrap: wrap; justify-content: space-around;
            gap: 0.8rem; margin: 0.8rem 0;
        }
        .timeline-item {
            background: rgba(26,54,93,0.4); border-radius: 16px;
            padding: 0.8rem 1rem; text-align: center; flex: 1;
            min-width: 120px; border: 1px solid #1a365d;
        }
        .timeline-year { font-size: 1.3rem; font-weight: bold; color: #63b3ed; }
        .img-placeholder {
            background: #1a365d;
            border: 2px dashed #2b6cb0;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            color: #4a7a9c;
            font-size: 0.9rem;
            margin: 0.5rem 0;
        }
        .img-placeholder i { font-size: 2rem; color: #2b6cb0; display: block; margin-bottom: 0.5rem; }
        @media (max-width: 768px) {
            body { padding: 10px; padding-bottom: 70px; }
            .slides-container { height: 80vh; border-radius: 20px; }
            .slide { padding: 1.2rem 1.5rem; }
            h1 { font-size: 1.6rem; }
            h2 { font-size: 1.3rem; }
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .nav-arrow { width: 36px; height: 36px; font-size: 1rem; }
            .nav-arrow-left { left: 8px; }
            .nav-arrow-right { right: 8px; }
            .fixed-footer { padding: 0.5rem 1rem; gap: 1rem; }
            .footer-btn { padding: 0.4rem 1.2rem; font-size: 0.8rem; }
            .dots-container { bottom: 12px; padding: 4px 10px; }
            .dot { width: 8px; height: 8px; }
            .dot.active { width: 18px; }
            .slide-number { bottom: 12px; right: 16px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>

<div class="slides-container">
    <button class="nav-arrow nav-arrow-left" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
    <button class="nav-arrow nav-arrow-right" id="nextBtn"><i class="fas fa-chevron-right"></i></button>

<div class="fixed-footer">

    <button class="footer-btn primary" id="ejerciciosBtn"><i class="fas fa-pen-alt"></i> Ejercicios</button>
</div>

<script>
    // ================================================================
    // SLIDES - SISMOS, VOLCANES, HURACANES Y TSUNAMIS
    // BASADO EN LA GUÍA "GUÍA FÍSICA VOLCANES.pdf"
    // TOTAL: 43 SLIDES
    // ================================================================

    // NOTA: Las imágenes marcadas con [IMAGEN] deben ser reemplazadas por URLs reales.

    const slides = [
        // ================================================================
        // SLIDE 0: PORTADA
        // ================================================================
        {
            title: "🌋 Desastres Naturales",
            content: `
                <div style="display:flex; flex-direction:column; justify-content:center; height:100%;">
                    <div class="badge">Clase 7 - Ciencias Naturales</div>
                    <h1 style="font-size:3.2rem;">Desastres Naturales</h1>
                    <p style="font-size:1.3rem; color:#90cdf4; margin:0.5rem 0;">Sismos • Volcanes • Huracanes • Tsunamis</p>
                    <div style="margin-top:1.5rem; display:flex; gap:1.5rem; flex-wrap:wrap;">
                        <div style="background:rgba(26,54,93,0.5); padding:0.5rem 1.2rem; border-radius:30px; border:1px solid #1a365d;">
                            <i class="fas fa-waveform" style="color:#63b3ed;"></i> Sismos
                        </div>
                        <div style="background:rgba(26,54,93,0.5); padding:0.5rem 1.2rem; border-radius:30px; border:1px solid #1a365d;">
                            <i class="fas fa-fire" style="color:#63b3ed;"></i> Volcanes
                        </div>
                        <div style="background:rgba(26,54,93,0.5); padding:0.5rem 1.2rem; border-radius:30px; border:1px solid #1a365d;">
                            <i class="fas fa-wind" style="color:#63b3ed;"></i> Huracanes
                        </div>
                        <div style="background:rgba(26,54,93,0.5); padding:0.5rem 1.2rem; border-radius:30px; border:1px solid #1a365d;">
                            <i class="fas fa-water" style="color:#63b3ed;"></i> Tsunamis
                        </div>
                    </div>
                    <div style="margin-top:2rem; color:#4a7a9c; font-size:0.9rem;">
                        <i class="fas fa-arrow-right"></i> Usa las flechas ← → para navegar
                    </div>
                </div>
            `
        },

        // ================================================================
        // SECCIÓN 1: SISMOS (13 SLIDES)
        // ================================================================

        // === SLIDE 1: DEFINICIÓN DE ACTIVIDAD SÍSMICA ===
        {
            title: "📈 Actividad Sísmica",
            content: `
                <div class="badge">Sismos - Definición</div>
                <h2>¿Qué es la actividad sísmica?</h2>
                <div class="grid-2">
                    <div class="card">
                        <i class="fas fa-waveform"></i>
                        <h4>Definición</h4>
                        <p>La <span class="highlight">actividad sísmica</span> se refiere al conjunto de movimientos o temblores que ocurren en la <span class="highlight">corteza terrestre</span> debido a la liberación de energía acumulada por la fractura o desplazamiento de las <span class="highlight">placas tectónicas</span>.</p>
                        <p style="margin-top:0.5rem;">Estos movimientos generan <span class="highlight">ondas sísmicas</span> que se propagan por el suelo.</p>
                    </div>
                    <div class="card">
                        <i class="fas fa-mountain"></i>
                        <h4>Causas principales</h4>
                        <ul>
                            <li><span class="highlight">Roce</span> entre placas tectónicas</li>
                            <li><span class="highlight">Choque</span> de placas tectónicas</li>
                            <li><span class="highlight">Desplazamiento</span> de placas o fallas geológicas</li>
                            <li>Acumulación de <span class="highlight">energía elástica</span> que se libera repentinamente</li>
                        </ul>
                    </div>
                </div>
                <div class="info-box">
                    <i class="fas fa-lightbulb"></i> <strong>Idea clave:</strong> Los sismos son el resultado de la <span class="highlight">liberación repentina de energía</span> acumulada en el interior de la Tierra.
                </div>
                <div class="img-placeholder">
                    <div class="img-container" style="margin:0.5rem 0;">
                    <img src="https://i.ibb.co/35qxWfy3/image.png" alt="Destrucción en Valdivia por el terremoto de 1960" style="max-width:300px; border-radius:12px; border:1px solid #1a365d; max-height:auto;">
                    </div>
                    Destrucción en Valdivia a causa del terremoto de 1960<br>
                </div>
            `
        },

        // === SLIDE 2: CONSECUENCIAS DE LOS SISMOS ===
        {
            title: "⚠️ Consecuencias de los sismos",
            content: `
                <div class="badge">Sismos - Consecuencias</div>
                <h2>Impacto de los sismos</h2>
                <div class="grid-2">
                    <div class="card">
                        <i class="fas fa-building" style="color:#ef4444;"></i>
                        <h4 style="color:#ef4444;">Daños materiales</h4>
                        <ul>
                            <li>Daños estructurales en <span class="highlight">edificios y caminos</span></li>
                            <li><span class="highlight">Ruptura de tuberías</span> (agua, gas)</li>
                            <li>Destrucción de <span class="highlight">viviendas e infraestructura</span></li>
                            <li><span class="highlight">Deslizamientos de tierra</span></li>
                            <li><span class="highlight">Aludes</span> y <span class="highlight">incendios</span></li>
                        </ul>
                    </div>
                    <div class="card">
                        <i class="fas fa-heart" style="color:#ef4444;"></i>
                        <h4 style="color:#ef4444;">Impacto humano</h4>
                        <ul>
                            <li>Pérdida de <span class="highlight">vidas humanas</span></li>
                            <li>Heridos y <span class="highlight">damnificados</span></li>
                            <li>Destrucción de <span class="highlight">comunidades enteras</span></li>
                            <li>Efectos <span class="highlight">sociales y económicos</span> graves</li>
                            <li><span class="highlight">Desplazamiento</span> de ciudades (ej. Concepción 1751)</li>
                        </ul>
                    </div>
                </div>
                <div class="info-box">
                    <i class="fas fa-lightbulb"></i> <strong>Consecuencia adicional:</strong> Si el epicentro está en el océano, los sismos pueden provocar <span class="highlight">tsunamis</span>. Los sismos también han llevado a <span class="highlight">cambios en las normas de construcción</span> para mitigar daños futuros.
                </div>
            `
        },

        // === SLIDE 3: SISMOS HISTÓRICOS EN CHILE ===
        {
            title: "🇨🇱 Sismos históricos en Chile",
            content: `
                <div class="badge">Sismos - Historia de Chile</div>
                <h2>Grandes sismos en la historia de Chile</h2>
                <div class="timeline">
                    <div class="timeline-item">
                        <div class="timeline-year">1647</div>
                        <p><strong>Santiago</strong></p>
                        <p>Gran terremoto destruyó Santiago</p>
                        <p>Crisis económica y social en el Chile colonial</p>
                    </div>
                    <div class="timeline-item">
                        <div class="timeline-year">1751</div>
                        <p><strong>Concepción</strong></p>
                        <p>Ciudad <span class="highlight">desplazada</span> tras el sismo</p>
                        <p>Cambios en la ubicación de la ciudad</p>
                    </div>
                    <div class="timeline-item">
                        <div class="timeline-year">1960</div>
                        <p><strong>Valdivia</strong></p>
                        <p>Magnitud: <span class="highlight">9.5</span> (el más potente)</p>
                        <p>1.600-4.000 muertos</p>
                        <p>2 millones de damnificados</p>
                        <p>Tsunami devastador</p>
                    </div>
                    <div class="timeline-item">
                        <div class="timeline-year">2010</div>
                        <p><strong>27 de Febrero</strong></p>
                        <p>Magnitud: <span class="highlight">8.8</span></p>
                        <p>432 fallecidos</p>
                        <p>2 millones de damnificados</p>
                        <p>Tsunami devastador en zonas costeras</p>
                    </div>
                </div>
                <div class="img-placeholder">
                    <div class="img-container" style="margin:0.5rem 0;">
                    <img src="https://i.ibb.co/QvjJ4Sq3/image.png" alt="Mapa Chile epicentros" style="max-width:300px; border-radius:12px; border:1px solid #1a365d; max-height:auto;">
                    </div>
                    Mapa de Chile con epicentros de sismos históricos<br>
                </div>
            `
        },

        // === SLIDE 4: CARACTERÍSTICAS DE LOS SISMOS ===
        {
            title: "📋 Características de los sismos",
            content: `
                <div class="badge">Sismos - Características</div>
                <h2>Características principales</h2>
                <div class="grid-2">
                    <div class="card">
                        <i class="fas fa-bolt"></i>
                        <h4>Naturaleza</h4>
                        <ul>
                            <li><span class="highlight">Temblores bruscos y repentinos</span></li>
                            <li>Liberación rápida de energía acumulada</li>
                            <li>Causados por roce, choque o desplazamiento de placas</li>
                        </ul>
                    </div>
                    <div class="card">
                        <i class="fas fa-location-dot"></i>
                        <h4>Partes del sismo</h4>
                        <ul>
                            <li><span class="highlight">Hipocentro (foco)</span>: punto dentro de la Tierra donde se origina</li>
                            <li><span class="highlight">Epicentro</span>: punto en la superficie directamente sobre el foco</li>
                            <li>En el epicentro se sienten con <span class="highlight">mayor intensidad</span></li>
                        </ul>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="card">
                        <i class="fas fa-arrow-down"></i>
                        <h4>Clasificación por profundidad</h4>
                        <ul>
                            <li><span class="highlight">Superficiales</span>: menos de 70 km (causan mayor daño)</li>
                            <li><span class="highlight">Intermedios</span>: 70 a 450 km</li>
                            <li><span class="highlight">Profundos</span>: más de 450 km</li>
                        </ul>
                    </div>
                    <div class="card">
                        <i class="fas fa-ruler"></i>
                        <h4>Medición</h4>
                        <ul>
                            <li><span class="highlight">Magnitud</span>: energía liberada (Escala Richter)</li>
                            <li><span class="highlight">Intensidad</span>: efectos y daños (Escala Mercalli)</li>
                            <li>Para grandes terremotos: <span class="highlight">Magnitud de Momento (Mw)</span></li>
                        </ul>
                    </div>
                </div>
            `
        },

        // === SLIDE 5: ESCALA DE MERCALLI ===
        {
            title: "📊 Escala de Mercalli",
            content: `
                <div class="badge">Sismos - Escalas</div>
                <h2>Escala de Mercalli (Intensidad)</h2>
                <div class="grid-2">
                    <div class="card">
                        <i class="fas fa-clipboard-list"></i>
                        <h4>Características</h4>
                        <ul>
                            <li>Escala <span class="highlight">cualitativa</span></li>
                            <li>Mide la <span class="highlight">intensidad</span> del sismo</li>
                            <li>Basada en <span class="highlight">efectos y daños</span> en construcciones, objetos, terreno y percepción humana</li>
                            <li>Creada en 1902 por <span class="highlight">Giuseppe Mercalli</span></li>
                            <li>Modificada en 1931 (Escala Modificada de Mercalli)</li>
                        </ul>
                    </div>
                    <div class="card">
                        <i class="fas fa-layer-group"></i>
                        <h4>12 grados (I al XII)</h4>
                        <ul>
                            <li><span class="highlight">I</span>: Muy leve, apenas sentido</li>
                            <li><span class="highlight">II-III</span>: Sentido por pocos</li>
                            <li><span class="highlight">IV-V</span>: Sentido por muchos, objetos se mueven</li>
                            <li><span class="highlight">VI-VII</span>: Daños en estructuras</li>
                            <li><span class="highlight">VIII-IX</span>: Daños graves</li>
                            <li><span class="highlight">X-XI</span>: Destrucción de edificios</li>
                            <li><span class="highlight">XII</span>: <span class="highlight">Destrucción total</span></li>
                        </ul>
                    </div>
                </div>
                <div class="info-box">
                    <i class="fas fa-lightbulb"></i> <strong>Factores que evalúa:</strong> Distancia al epicentro, tipo de construcción, geología del área, duración del sacudimiento, densidad poblacional.
                </div>
            `
        },

        // === SLIDE 6: ESCALA DE RICHTER ===
        {
            title: "📊 Escala de Richter",
            content: `
                <div class="badge">Sismos - Escalas</div>
                <h2>Escala de Richter (Magnitud)</h2>
                <div class="grid-2">
                    <div class="card">
                        <i class="fas fa-ruler"></i>
                        <h4>Características</h4>
                        <ul>
                            <li>Escala <span class="highlight">logarítmica</span></li>
                            <li>Mide la <span class="highlight">magnitud</span> (energía liberada)</li>
                            <li>Creada en 1935 por <span class="highlight">Charles Francis Richter</span></li>
                            <li>Junto con <span class="highlight">Beno Gutenberg</span></li>
                            <li>Basada en la amplitud de ondas sísmicas registradas por un <span class="highlight">sismógrafo</span></li>
                        </ul>
                    </div>
                    <div class="card">
                        <i class="fas fa-chart-line"></i>
                        <h4>Escala logarítmica</h4>
                        <ul>
                            <li>Cada unidad = <span class="highlight">10 veces más amplitud</span></li>
                            <li>Cada unidad = <span class="highlight">~31 veces más energía</span></li>
                            <li>Rango usual: 0 a 9 (sin límite teórico)</li>

                    <i class="fas fa-lightbulb"></i> <strong>Regla de oro:</strong> Si sientes un sismo fuerte en la costa, <span class="highlight">evacúa a zonas altas</span> sin esperar ninguna alerta oficial.
                </div>
            `
        },

        // === SLIDE 43: CIERRE ===
        {
            title: "🎯 ¡Clase completada!",
            content: `
                <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%; text-align:center;">
                    <div class="badge">Clase 7 - Completada</div>
                    <h1 style="font-size:2.8rem;">🎯 ¡Has completado la clase!</h1>
                    <p style="font-size:1.2rem; color:#90cdf4; margin:1rem 0;">Sismos • Volcanes • Huracanes • Tsunamis</p>
                    <div style="display:flex; gap:2rem; flex-wrap:wrap; justify-content:center; margin:1.5rem 0;">
                        <div style="background:rgba(26,54,93,0.5); padding:0.5rem 1.5rem; border-radius:30px; border:1px solid #1a365d;">
                            <i class="fas fa-check-circle" style="color:#63b3ed;"></i> 44 slides de contenido
                        </div>
                        <div style="background:rgba(26,54,93,0.5); padding:0.5rem 1.5rem; border-radius:30px; border:1px solid #1a365d;">
                            <i class="fas fa-graduation-cap" style="color:#63b3ed;"></i> Listo para los ejercicios
                        </div>
                    </div>
                    <p style="color:#4a7a9c; font-size:0.9rem;">Presiona <span class="highlight">"Ejercicios"</span> para poner a prueba tus conocimientos.</p>
                </div>
            `
        }
    ];

    // ================================================================
    // LÓGICA DE NAVEGACIÓN
    // ================================================================

    let currentSlide = 0;
    const totalSlides = slides.length;

    function renderSlides() {
        const wrapper = document.getElementById('slidesWrapper');
        wrapper.innerHTML = '';
        slides.forEach((slide, index) => {
            const div = document.createElement('div');
            div.className = 'slide';
            if (index === 0) div.classList.add('active');
            div.setAttribute('data-index', index);
            div.innerHTML = `
                ${slide.content}
                <div class="slide-number">${index + 1} / ${totalSlides}</div>
            `;
            wrapper.appendChild(div);
        });
        updateDots();
        updateButtons();
    }

    function updateDots() {
        const container = document.getElementById('dotsContainer');
        container.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            if (i === currentSlide) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(i));
            container.appendChild(dot);
        }
    }

    function updateButtons() {
        document.getElementById('prevBtn').disabled = currentSlide === 0;
        document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
    }

    function goToSlide(index) {
        if (index < 0 || index >= totalSlides) return;
        currentSlide = index;
        const slidesElements = document.querySelectorAll('.slide');
        slidesElements.forEach((slide, i) => {
            slide.classList.toggle('active', i === currentSlide);
        });
        updateDots();
        updateButtons();
    }

    function nextSlide() {
        if (currentSlide < totalSlides - 1) goToSlide(currentSlide + 1);
    }

    function prevSlide() {
        if (currentSlide > 0) goToSlide(currentSlide - 1);
    }

    document.getElementById('prevBtn').addEventListener('click', prevSlide);
    document.getElementById('nextBtn').addEventListener('click', nextSlide);

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });

    document.getElementById('cursoBtn').addEventListener('click', () => {
        window.location.href = 'Fisica.html';
    });

    document.getElementById('ejerciciosBtn').addEventListener('click', () => {
        window.location.href = 'C_7A_Fisica.html';
    });

    renderSlides();
</script>
</body>
